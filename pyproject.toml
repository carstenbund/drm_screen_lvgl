[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drm-screen-lvgl"
version = "0.1.3"
description = "LVGL renderer plugin for drm_screen: dirty-area compositing and vector scene layers, presented straight to DRM/KMS"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
# A name-only entry fills the Author header that pypistats and mirrors read.
authors = [
    { name = "Carsten Bund" },
]
dependencies = []
keywords = ["drm", "kms", "lvgl", "vector", "compositor", "embedded", "esp32", "raspberry-pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Hardware",
]

# Installing this package is the whole of the selection: drm_screen finds it
# here and offers it as "lvgl". Nothing in drm_screen imports it by name.
[project.entry-points."drm_screen.renderers"]
lvgl = "drm_screen_lvgl:LvglRenderer"

[project.optional-dependencies]
numpy = ["numpy"]

[project.urls]
Homepage = "https://github.com/carstenbund/drm_screen_lvgl"
Repository = "https://github.com/carstenbund/drm_screen_lvgl"
"Bug Tracker" = "https://github.com/carstenbund/drm_screen_lvgl/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["drm_screen_lvgl*"]
